image: node:22

stages:
  - deploy

pages:
  stage: deploy
  script:
    - npm ci
    - npm run build:gh-pages
    - rm -rf public
    - cp -R dist/cartographie-drive/browser public
    - cp public/index.html public/404.html
  pages:
    publish: public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
